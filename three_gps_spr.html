<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>GPS Sprite Test</title>

  <!-- 安定版：three.js 非module -->
  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #canvas { position:fixed; inset:0; width:100%; height:100%; }
    #start {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.85); z-index:10;
    }
    #start button {
      font-size:18px; padding:14px 18px; border-radius:10px; border:0;
    }
    #hud {
      position:fixed; top:0; left:0; right:0; z-index:11;
      background:rgba(0,0,0,.6); color:#0f0; padding:6px 8px;
      font:12px/1.35 monospace; white-space:pre;
    }
  </style>
</head>
<body>

<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start（カメラ＋GPS）</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* ====== 設定 ====== */
const IMAGE_URL = "./assets/object01.png";

/* 目的地（ここを書き換える） */
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;

/* 表示の基準距離（m）と拡大の強さ */
const BASE_DISTANCE_M = 30;      // 30mで scale がだいたい 1 になる
const SCALE_MIN = 0.7;           // 最小
const SCALE_MAX = 6.0;           // 最大（大きく見せたいので上げ気味）

/* 画面内でどれくらい左右に振るか（メートル換算の仮想距離） */
const RING_DISTANCE = 3.0;       // 3m前方の円周上に置く（左右の動きが分かりやすい）

/* 平滑化（小さいほど安定・大きいほど反応） */
const ALPHA_GPS = 0.10;
const ALPHA_HEAD = 0.15;
const ALPHA_POS = 0.15;

/* ====== ユーティリティ ====== */
function clamp(v,a,b){ return Math.min(Math.max(v,a),b); }
function lerp(a,b,t){ return a + (b-a)*t; }
function wrapPi(r){
  r = (r + Math.PI) % (2*Math.PI);
  if(r < 0) r += 2*Math.PI;
  return r - Math.PI;
}
function deg2rad(d){ return d * Math.PI / 180; }
function rad2deg(r){ return r * 180 / Math.PI; }

function distM(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = deg2rad(lat2-lat1);
  const dLon = deg2rad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*
    Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingRad(lat1, lon1, lat2, lon2){
  const y = Math.sin(deg2rad(lon2-lon1)) * Math.cos(deg2rad(lat2));
  const x =
    Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2)) -
    Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(deg2rad(lon2-lon1));
  return Math.atan2(y, x); // -pi..pi
}

/* ====== three.js 基本 ====== */
const hud = document.getElementById("hud");
const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
camera.position.set(0, 0, 0);

let sprite = null;
let video = null;
let videoTexture = null;

/* GPS / heading */
let lat = null, lon = null;
let latS = null, lonS = null;
let heading = null;   // rad
let headingS = 0;     // rad 平滑化

/* 位置平滑化 */
let xS = 0;
let zS = -RING_DISTANCE;

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

/* ====== Start（ユーザー操作で権限を確実に出す） ====== */
async function startAll(){
  document.getElementById("start").style.display = "none";

  try{
    hud.textContent = "Requesting camera…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:"environment", width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });

    video = document.createElement("video");
    video.playsInline = true;
    video.muted = true;
    video.srcObject = stream;
    await video.play();

    videoTexture = new THREE.VideoTexture(video);
    scene.background = videoTexture;

    hud.textContent = "Camera OK. Loading sprite…";

    const tex = new THREE.TextureLoader().load(
      IMAGE_URL,
      ()=>{},
      undefined,
      ()=>alert("IMAGE LOAD FAILED: " + IMAGE_URL)
    );

    const mat = new THREE.SpriteMaterial({ map: tex, transparent:true });
    sprite = new THREE.Sprite(mat);

    // まず見えるサイズ（大きめ）
    sprite.scale.set(2.5, 2.5, 1);
    sprite.position.set(0, 0, -RING_DISTANCE);
    scene.add(sprite);

    // GPS
    hud.textContent = "Camera OK. Waiting GPS…";
    navigator.geolocation.watchPosition(
      (p)=>{
        lat = p.coords.latitude;
        lon = p.coords.longitude;
        if(latS === null){ latS = lat; lonS = lon; }
      },
      (e)=>{
        alert("GPS ERROR: " + e.message);
      },
      { enableHighAccuracy:true, maximumAge:0, timeout:20000 }
    );

    // 方位（Androidは deviceorientationabsolute が来ることが多い）
    window.addEventListener("deviceorientationabsolute", (e)=>{
      if(e.alpha != null){
        heading = deg2rad(e.alpha);
        headingS = headingS + wrapPi(heading - headingS) * ALPHA_HEAD;
      }
    });

    // 来ない機種もあるので deviceorientation も保険
    window.addEventListener("deviceorientation", (e)=>{
      if(heading == null && e.alpha != null){
        heading = deg2rad(e.alpha);
        headingS = headingS + wrapPi(heading - headingS) * ALPHA_HEAD;
      }
    });

  }catch(err){
    alert("START ERROR: " + err.name + "\n" + err.message);
  }
}

document.getElementById("btn").addEventListener("click", startAll);

/* ====== ループ ====== */
function animate(){
  requestAnimationFrame(animate);

  // 背景が無い間は描画しない
  if(!videoTexture){
    renderer.render(scene, camera);
    return;
  }

  // spriteが無いなら背景だけ
  if(!sprite){
    renderer.render(scene, camera);
    return;
  }

  // GPSがまだなら固定表示（とりあえず見える状態）
  if(latS === null || lat === null){
    sprite.position.set(0, 0, -RING_DISTANCE);
    renderer.render(scene, camera);
    hud.textContent = "Camera OK. Waiting GPS…（屋外で数十秒待つ）";
    return;
  }

  // GPS平滑化
  latS = lerp(latS, lat, ALPHA_GPS);
  lonS = lerp(lonS, lon, ALPHA_GPS);

  // 目的地まで距離・方位
  const d = distM(latS, lonS, TARGET_LAT, TARGET_LON);
  const b = bearingRad(latS, lonS, TARGET_LAT, TARGET_LON);

  // heading が取れてない場合は正面固定（左右の動きだけ止まる）
  const rel = wrapPi(b - (headingS || 0));

  // 方位で左右へ（3m前方円周上）
  const x = Math.sin(rel) * RING_DISTANCE;
  const z = -Math.cos(rel) * RING_DISTANCE;

  xS = lerp(xS, x, ALPHA_POS);
  zS = lerp(zS, z, ALPHA_POS);

  sprite.position.set(xS, 0, zS);

  // 距離でスケール（近づくと大きく）
  // 例：d=BASE_DISTANCEでscale≈1、dが半分なら≈2
  const scale = clamp(BASE_DISTANCE_M / Math.max(d, 1), SCALE_MIN, SCALE_MAX);
  sprite.scale.set(2.5*scale, 2.5*scale, 1); // 画像は大きく見せたいので倍率を掛ける

  hud.textContent =
`dist=${d.toFixed(1)}m  scale=${scale.toFixed(2)}
rel(deg)=${rad2deg(rel).toFixed(1)}  heading(deg)=${headingS?rad2deg(headingS).toFixed(1):"NA"}
lat=${latS.toFixed(6)} lon=${lonS.toFixed(6)}
Tip: 屋外でGPS精度が上がると安定します`;

  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
