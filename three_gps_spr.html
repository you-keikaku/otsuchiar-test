<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GPS AR Sprite FINAL (Aspect)</title>

<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

/* カメラ映像（最下層・安定） */
#cam{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  z-index:0;
}

/* three.js HUD */
#canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:1;
  pointer-events:none;
}

/* UI */
#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10;
}
#start button{
  font-size:18px;
  padding:14px 18px;
}
#hud{
  position:fixed;
  top:0; left:0; right:0;
  z-index:11;
  background:rgba(0,0,0,.6);
  color:#0f0;
  font:12px monospace;
  padding:6px;
}
</style>
</head>

<body>

<video id="cam" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start</button>
</div>

<script>
/* ===== 設定 ===== */
const IMAGE_URL = "./assets/object01.png"; // 例：1024×768
const TARGET_LAT = 39.359430;
const TARGET_LON = 141.904845;
const SHOW_DISTANCE_M = 10;

/* 表示サイズ基準（横幅px） */
const BASE_WIDTH_PX = 300;

/* util */
function deg2rad(d){return d*Math.PI/180;}
function distM(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=deg2rad(lat2-lat1);
  const dLon=deg2rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ===== three.js 初期化 ===== */
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("canvas"),
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(window.devicePixelRatio || 1);

const scene = new THREE.Scene();
let camera;
let sprite;

/* GPS */
let lat=null, lon=null;

/* ===== resize（超重要） ===== */
function resize(){
  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(w, h, false);

  const canvas = renderer.domElement;
  canvas.style.width  = "100vw";
  canvas.style.height = "100vh";
  canvas.style.left   = "0";
  canvas.style.top    = "0";

  camera = new THREE.OrthographicCamera(
    -w/2, w/2,
     h/2,-h/2,
     0, 10
  );
  camera.position.z = 5;
}
window.addEventListener("resize", resize);

/* ===== start ===== */
async function start(){
  document.getElementById("start").style.display="none";

  /* カメラ（CSS video） */
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"},
    audio:false
  });
  document.getElementById("cam").srcObject = stream;

  /* Sprite（縦横比保持） */
  const loader = new THREE.TextureLoader();
  loader.load(IMAGE_URL, (texture)=>{

    const imgW = texture.image.width;
    const imgH = texture.image.height;
    const aspect = imgH / imgW;   // ★ 元画像の縦横比

    const displayW = BASE_WIDTH_PX;
    const displayH = displayW * aspect;

    sprite = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: texture,
        transparent: true
      })
    );

    sprite.position.set(0,0,1);                // 画面中央
    sprite.scale.set(displayW, displayH, 1);   // ★ 比率保持
    sprite.visible = false;

    scene.add(sprite);
  });

  /* GPS */
  navigator.geolocation.watchPosition(
    p => { lat=p.coords.latitude; lon=p.coords.longitude; },
    e => alert(e.message),
    { enableHighAccuracy:true }
  );

  resize();
}
document.getElementById("btn").onclick = start;

/* ===== loop ===== */
function animate(){
  requestAnimationFrame(animate);

  if(sprite && lat!=null){
    const d = distM(lat, lon, TARGET_LAT, TARGET_LON);
    sprite.visible = (d <= SHOW_DISTANCE_M);
    document.getElementById("hud").textContent =
`distance=${d.toFixed(1)}m
visible=${sprite.visible}`;
  }else{
    document.getElementById("hud").textContent="Camera OK. Waiting GPS…";
  }

  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
