<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>GPS Sprite Portrait Safe</title>

  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 10;
    }
    #start button {
      font-size: 18px;
      padding: 14px 18px;
      border-radius: 10px;
      border: none;
    }
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 11;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      font: 12px/1.35 monospace;
      padding: 6px 8px;
      white-space: pre;
    }
  </style>
</head>
<body>

<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start（カメラ＋GPS）</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* ========= 設定 ========= */

const IMAGE_URL = "./assets/object01.png";

/* 目的地 */
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;

/* 表示位置 */
const FIXED_Z = -2.5;      // 常にカメラ前
const SIDE_RANGE = 1.2;    // 左右のみ

/* 距離→サイズ（控えめ） */
const BASE_DISTANCE_M = 60;
const SCALE_MIN = 0.7;
const SCALE_MAX = 1.3;

/* 安定化 */
const ALPHA_GPS  = 0.05;
const ALPHA_HEAD = 0.05;
const ALPHA_POS  = 0.08;

/* ========= ユーティリティ ========= */
function clamp(v,a,b){ return Math.min(Math.max(v,a),b); }
function lerp(a,b,t){ return a+(b-a)*t; }
function wrapPi(r){
  r = (r + Math.PI) % (2*Math.PI);
  if(r < 0) r += 2*Math.PI;
  return r - Math.PI;
}
function deg2rad(d){ return d * Math.PI / 180; }
function rad2deg(r){ return r * 180 / Math.PI; }

function distM(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = deg2rad(lat2-lat1);
  const dLon = deg2rad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*
    Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingRad(lat1, lon1, lat2, lon2){
  const y = Math.sin(deg2rad(lon2-lon1))*Math.cos(deg2rad(lat2));
  const x =
    Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2)) -
    Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(deg2rad(lon2-lon1));
  return Math.atan2(y,x);
}

/* ========= three.js ========= */

const hud = document.getElementById("hud");
const canvas = document.getElementById("canvas");

const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

/* 背景 */
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
bgScene.add(bgCam);
let bgMesh = null;

/* 前景 */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
camera.position.set(0,0,0);

let sprite = null;
let video = null;
let videoTexture = null;

/* センサー */
let lat=null, lon=null, latS=null, lonS=null;
let headingS = 0;
let xS = 0;

/* ========= サイズ計算（核心） ========= */
function getBaseSpriteSize(){
  const aspect = window.innerWidth / window.innerHeight;

  // 縦画面ほど小さく、横画面ほど少し大きく
  if(aspect < 0.75) return 0.55;     // 縦持ち（安全サイズ）
  if(aspect < 1.0)  return 0.65;
  if(aspect < 1.5)  return 0.75;
  return 0.85;                       // 横持ち
}

/* ========= 背景 cover ========= */
function updateCover(){
  if(!bgMesh || !video || !video.videoWidth) return;

  const sa = innerWidth / innerHeight;
  const va = video.videoWidth / video.videoHeight;

  let sx=1, sy=1;
  if(va > sa) sx = va/sa;
  else sy = sa/va;

  bgMesh.scale.set(sx, sy, 1);
}

/* ========= resize ========= */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  updateCover();
}
window.addEventListener("resize", resize);

/* ========= start ========= */
async function startAll(){
  document.getElementById("start").style.display = "none";

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });

    video = document.createElement("video");
    video.playsInline = true;
    video.muted = true;
    video.srcObject = stream;
    await video.play();

    videoTexture = new THREE.VideoTexture(video);
    bgMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2,2),
      new THREE.MeshBasicMaterial({ map: videoTexture })
    );
    bgScene.add(bgMesh);
    updateCover();

    const tex = new THREE.TextureLoader().load(IMAGE_URL);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent:true });
    sprite = new THREE.Sprite(mat);
    scene.add(sprite);

    navigator.geolocation.watchPosition(
      p=>{
        lat=p.coords.latitude; lon=p.coords.longitude;
        if(latS===null){ latS=lat; lonS=lon; }
      },
      e=>alert("GPS ERROR: "+e.message),
      { enableHighAccuracy:true }
    );

    window.addEventListener("deviceorientationabsolute",e=>{
      if(e.alpha!=null){
        const h=deg2rad(e.alpha);
        headingS += wrapPi(h-headingS)*ALPHA_HEAD;
      }
    });

  }catch(e){
    alert(e.message);
  }
}

document.getElementById("btn").onclick=startAll;

/* ========= loop ========= */
function animate(){
  requestAnimationFrame(animate);

  if(!videoTexture){
    renderer.render(scene,camera);
    return;
  }

  renderer.render(bgScene,bgCam);

  if(!sprite || latS===null || lat===null){
    renderer.autoClear=false;
    renderer.render(scene,camera);
    renderer.autoClear=true;
    return;
  }

  latS=lerp(latS,lat,ALPHA_GPS);
  lonS=lerp(lonS,lon,ALPHA_GPS);

  const d=distM(latS,lonS,TARGET_LAT,TARGET_LON);
  const b=bearingRad(latS,lonS,TARGET_LAT,TARGET_LON);
  const rel=wrapPi(b-headingS);

  const x=Math.sin(rel)*SIDE_RANGE;
  xS=lerp(xS,x,ALPHA_POS);

  sprite.position.set(xS,0,FIXED_Z);

  const base=getBaseSpriteSize();
  const scale=clamp(BASE_DISTANCE_M/Math.max(d,1),SCALE_MIN,SCALE_MAX);

  sprite.scale.set(base*scale,base*scale,1);

  hud.textContent=
`dist=${d.toFixed(1)}m
base=${base.toFixed(2)} scale=${scale.toFixed(2)}
aspect=${(innerWidth/innerHeight).toFixed(2)}`;

  renderer.autoClear=false;
  renderer.render(scene,camera);
  renderer.autoClear=true;
}

resize();
animate();
</script>

</body>
</html>
