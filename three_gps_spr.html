<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GPS Sprite 10m CENTER</title>

<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#canvas{
  position:fixed;
  inset:0;
}
#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10;
}
#start button{
  font-size:18px;
  padding:14px 18px;
  border-radius:10px;
  border:none;
}
#hud{
  position:fixed;
  top:0; left:0; right:0;
  z-index:11;
  background:rgba(0,0,0,.6);
  color:#0f0;
  font:12px/1.35 monospace;
  padding:6px 8px;
  white-space:pre;
}
</style>
</head>

<body>
<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* ===== 設定 ===== */
const IMAGE_URL = "./assets/object01.png";
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;
const SHOW_DISTANCE_M = 10;

/* 表示は完全固定 */
const FIXED_Z = -2.0;
const BASE_SPRITE_SIZE = 0.6;

/* util */
function deg2rad(d){ return d*Math.PI/180; }
function distM(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=deg2rad(lat2-lat1);
  const dLon=deg2rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* three.js */
const hud = document.getElementById("hud");
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("canvas"),
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.autoClear = false;

/* 背景 */
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
bgScene.add(bgCam);

/* 前景 */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60,1,0.1,100);
camera.position.set(0,0,0);

let bgMesh, video, videoTexture, sprite;
let lat=null, lon=null;

/* resize */
function updateCover(){
  if(!bgMesh||!video||!video.videoWidth) return;
  const sa=innerWidth/innerHeight;
  const va=video.videoWidth/video.videoHeight;
  let sx=1, sy=1;
  if(va>sa) sx=va/sa; else sy=sa/va;
  bgMesh.scale.set(sx,sy,1);
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  updateCover();
}
window.addEventListener("resize",resize);

/* start */
async function start(){
  document.getElementById("start").style.display="none";

  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"},
    audio:false
  });

  video=document.createElement("video");
  video.playsInline=true;
  video.muted=true;
  video.srcObject=stream;
  await video.play();

  videoTexture=new THREE.VideoTexture(video);
  bgMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(2,2),
    new THREE.MeshBasicMaterial({map:videoTexture})
  );
  bgScene.add(bgMesh);
  updateCover();

  const tex=new THREE.TextureLoader().load(IMAGE_URL);
  const mat=new THREE.SpriteMaterial({
    map:tex,
    transparent:true,
    depthTest:false,
    depthWrite:false
  });

  sprite=new THREE.Sprite(mat);
  sprite.scale.set(BASE_SPRITE_SIZE,BASE_SPRITE_SIZE,1);
  sprite.renderOrder=999;
  sprite.visible=false;
  scene.add(sprite);

  navigator.geolocation.watchPosition(
    p=>{lat=p.coords.latitude;lon=p.coords.longitude;},
    e=>alert(e.message),
    {enableHighAccuracy:true}
  );

  resize();
}
document.getElementById("btn").onclick=start;

/* loop */
function animate(){
  requestAnimationFrame(animate);

  if(!videoTexture){
    renderer.clear();
    renderer.render(scene,camera);
    return;
  }

  if(sprite && lat!=null){
    const d=distM(lat,lon,TARGET_LAT,TARGET_LON);
    sprite.visible = (d<=SHOW_DISTANCE_M);

    /* ★ 常に画面中央に吸着 */
    sprite.position.set(0,0,FIXED_Z);

    hud.textContent =
`distance=${d.toFixed(1)}m
visible=${sprite.visible}
position=center`;
  }else{
    hud.textContent="Camera OK. Waiting GPS…";
  }

  renderer.clear();
  renderer.render(bgScene,bgCam);
  renderer.clearDepth();
  renderer.render(scene,camera);
}
resize();
animate();
</script>
</body>
</html>
