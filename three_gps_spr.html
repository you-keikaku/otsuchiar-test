<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <title>GPS Sprite Stable</title>

  <!-- 安定版 three.js（非module） -->
  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 10;
    }
    #start button {
      font-size: 18px;
      padding: 14px 18px;
      border-radius: 10px;
      border: none;
    }
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 11;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      font: 12px/1.35 monospace;
      padding: 6px 8px;
      white-space: pre;
    }
  </style>
</head>
<body>

<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start（カメラ＋GPS）</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* ========= 設定 ========= */

const IMAGE_URL = "./assets/object01.png";

/* 目的地（必要に応じて変更） */
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;

/* 表示位置（前後固定） */
const FIXED_Z = -2.2;          // 常にカメラ前 2.2m
const SIDE_RANGE = 1.4;        // 左右の最大移動幅（m）

/* サイズ制御 */
const BASE_SPRITE_SIZE = 0.8;  // 基準サイズ（画面内優先）
const BASE_DISTANCE_M = 50;    // 50mで scale=1
const SCALE_MIN = 0.7;
const SCALE_MAX = 1.5;

/* 平滑化（安定重視） */
const ALPHA_GPS  = 0.05;
const ALPHA_HEAD = 0.05;
const ALPHA_POS  = 0.08;

/* ========= ユーティリティ ========= */

function clamp(v,a,b){ return Math.min(Math.max(v,a),b); }
function lerp(a,b,t){ return a + (b-a)*t; }
function wrapPi(r){
  r = (r + Math.PI) % (2*Math.PI);
  if(r < 0) r += 2*Math.PI;
  return r - Math.PI;
}
function deg2rad(d){ return d * Math.PI / 180; }
function rad2deg(r){ return r * 180 / Math.PI; }

function distM(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = deg2rad(lat2-lat1);
  const dLon = deg2rad(lon2-lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*
    Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingRad(lat1, lon1, lat2, lon2){
  const y = Math.sin(deg2rad(lon2-lon1)) * Math.cos(deg2rad(lat2));
  const x =
    Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2)) -
    Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(deg2rad(lon2-lon1));
  return Math.atan2(y, x);
}

/* ========= three.js 基本 ========= */

const hud = document.getElementById("hud");
const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

/* 背景（カメラ） */
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
bgScene.add(bgCam);
let bgMesh = null;

/* 前景（Sprite） */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
camera.position.set(0,0,0);

let sprite = null;
let video = null;
let videoTexture = null;

/* GPS / heading */
let lat = null, lon = null;
let latS = null, lonS = null;
let headingS = 0;

/* 表示位置平滑化 */
let xS = 0;

/* ========= リサイズ ========= */

function resize(){
  const w = innerWidth;
  const h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  updateCover();
}
window.addEventListener("resize", resize);

/* ========= 背景 cover 表示 ========= */

function updateCover(){
  if(!bgMesh || !video || !video.videoWidth) return;

  const screenAspect = innerWidth / innerHeight;
  const videoAspect  = video.videoWidth / video.videoHeight;

  let sx = 1, sy = 1;
  if(videoAspect > screenAspect){
    sx = videoAspect / screenAspect;
  }else{
    sy = screenAspect / videoAspect;
  }
  bgMesh.scale.set(sx, sy, 1);
}

/* ========= Start ========= */

async function startAll(){
  document.getElementById("start").style.display = "none";

  try{
    hud.textContent = "Requesting camera…";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:"environment", width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });

    video = document.createElement("video");
    video.playsInline = true;
    video.muted = true;
    video.srcObject = stream;
    await video.play();

    videoTexture = new THREE.VideoTexture(video);

    bgMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2,2),
      new THREE.MeshBasicMaterial({ map: videoTexture })
    );
    bgScene.add(bgMesh);
    updateCover();

    /* Sprite */
    const tex = new THREE.TextureLoader().load(IMAGE_URL);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent:true });
    sprite = new THREE.Sprite(mat);
    sprite.scale.set(BASE_SPRITE_SIZE, BASE_SPRITE_SIZE, 1);
    sprite.position.set(0, 0, FIXED_Z);
    scene.add(sprite);

    /* GPS */
    hud.textContent = "Waiting GPS…";
    navigator.geolocation.watchPosition(
      (p)=>{
        lat = p.coords.latitude;
        lon = p.coords.longitude;
        if(latS === null){ latS = lat; lonS = lon; }
      },
      (e)=>alert("GPS ERROR: "+e.message),
      { enableHighAccuracy:true, maximumAge:0 }
    );

    /* 方位 */
    window.addEventListener("deviceorientationabsolute",(e)=>{
      if(e.alpha != null){
        const h = deg2rad(e.alpha);
        headingS = headingS + wrapPi(h - headingS) * ALPHA_HEAD;
      }
    });
    window.addEventListener("deviceorientation",(e)=>{
      if(e.alpha != null && headingS === 0){
        const h = deg2rad(e.alpha);
        headingS = headingS + wrapPi(h - headingS) * ALPHA_HEAD;
      }
    });

  }catch(err){
    alert("START ERROR: "+err.message);
  }
}

document.getElementById("btn").addEventListener("click", startAll);

/* ========= ループ ========= */

function animate(){
  requestAnimationFrame(animate);

  if(!videoTexture){
    renderer.render(scene, camera);
    return;
  }

  if(!sprite || latS === null || lat === null){
    renderer.render(bgScene, bgCam);
    renderer.autoClear = false;
    renderer.render(scene, camera);
    renderer.autoClear = true;
    return;
  }

  /* GPS 平滑化 */
  latS = lerp(latS, lat, ALPHA_GPS);
  lonS = lerp(lonS, lon, ALPHA_GPS);

  const d = distM(latS, lonS, TARGET_LAT, TARGET_LON);
  const b = bearingRad(latS, lonS, TARGET_LAT, TARGET_LON);
  const rel = wrapPi(b - headingS);

  /* 左右のみ移動（消えない） */
  const x = Math.sin(rel) * SIDE_RANGE;
  xS = lerp(xS, x, ALPHA_POS);
  sprite.position.set(xS, 0, FIXED_Z);

  /* サイズ制御（画面内優先） */
  const scale = clamp(BASE_DISTANCE_M / Math.max(d,1), SCALE_MIN, SCALE_MAX);
  sprite.scale.set(
    BASE_SPRITE_SIZE * scale,
    BASE_SPRITE_SIZE * scale,
    1
  );

  hud.textContent =
`dist=${d.toFixed(1)}m  scale=${scale.toFixed(2)}
rel=${rad2deg(rel).toFixed(1)}deg`;

  renderer.render(bgScene, bgCam);
  renderer.autoClear = false;
  renderer.render(scene, camera);
  renderer.autoClear = true;
}

resize();
animate();
</script>

</body>
</html>
