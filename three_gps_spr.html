<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GPS Sprite 10m CENTER 2D FULL</title>

<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#canvas{
  position:fixed;
  inset:0;
}
#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10;
}
#start button{
  font-size:18px;
  padding:14px 18px;
}
#hud{
  position:fixed;
  top:0; left:0; right:0;
  z-index:11;
  background:rgba(0,0,0,.6);
  color:#0f0;
  font:12px monospace;
  padding:6px;
}
</style>
</head>

<body>
<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* ===== 設定 ===== */
const IMAGE_URL = "./assets/object01.png";
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;
const SHOW_DISTANCE_M = 10;

/* 画面中央固定サイズ（px基準） */
const SPRITE_PX = 240; // 縦画面で安全。200〜300で調整可

/* util */
function deg2rad(d){ return d*Math.PI/180; }
function distM(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=deg2rad(lat2-lat1);
  const dLon=deg2rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* renderer */
const hud=document.getElementById("hud");
const renderer=new THREE.WebGLRenderer({
  canvas:document.getElementById("canvas"),
  alpha:true,
  antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.autoClear=true;

/* ===== 2Dシーン（ピクセル座標系） ===== */
const scene=new THREE.Scene();
let camera;

/* 背景・Sprite */
let video, bgMesh, sprite;

/* GPS */
let lat=null, lon=null;

/* ===== resize ===== */
function resize(){
  const w=innerWidth;
  const h=innerHeight;

  renderer.setSize(w,h,false);

  // ★ ピクセル基準のOrthoCamera
  camera=new THREE.OrthographicCamera(
    -w/2, w/2,
     h/2,-h/2,
     0,10
  );
  camera.position.z=5;
  scene.clear();
  scene.add(camera);

  if(bgMesh) scene.add(bgMesh);
  if(sprite) scene.add(sprite);

  updateCover();
}
window.addEventListener("resize",resize);

/* 背景を画面いっぱいに */
function updateCover(){
  if(!bgMesh||!video||!video.videoWidth) return;

  const screenAspect=innerWidth/innerHeight;
  const videoAspect=video.videoWidth/video.videoHeight;

  let w=innerWidth;
  let h=innerHeight;

  if(videoAspect>screenAspect){
    w=h*videoAspect;
  }else{
    h=w/videoAspect;
  }
  bgMesh.scale.set(w,h,1);
}

/* start */
async function start(){
  document.getElementById("start").style.display="none";

  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"},
    audio:false
  });

  video=document.createElement("video");
  video.playsInline=true;
  video.muted=true;
  video.srcObject=stream;
  await video.play();

  const videoTex=new THREE.VideoTexture(video);

  bgMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:videoTex})
  );
  bgMesh.position.set(0,0,0);
  scene.add(bgMesh);

  const tex=new THREE.TextureLoader().load(IMAGE_URL);
  sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true
    })
  );

  // ★ 画面中央・px指定
  sprite.position.set(0,0,1);
  sprite.scale.set(SPRITE_PX,SPRITE_PX,1);
  sprite.visible=false;
  scene.add(sprite);

  navigator.geolocation.watchPosition(
    p=>{lat=p.coords.latitude;lon=p.coords.longitude;},
    e=>alert(e.message),
    {enableHighAccuracy:true}
  );

  resize();
}
document.getElementById("btn").onclick=start;

/* loop */
function animate(){
  requestAnimationFrame(animate);

  if(sprite && lat!=null){
    const d=distM(lat,lon,TARGET_LAT,TARGET_LON);
    sprite.visible = (d<=SHOW_DISTANCE_M);
    hud.textContent=
`distance=${d.toFixed(1)}m
visible=${sprite.visible}`;
  }else{
    hud.textContent="Camera OK. Waiting GPS…";
  }

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
