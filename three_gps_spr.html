<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GPS Sprite 10m ONLY</title>

<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#canvas{
  position:fixed;
  inset:0;
}
#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10;
}
#start button{
  font-size:18px;
  padding:14px 18px;
}
#hud{
  position:fixed;
  top:0; left:0; right:0;
  z-index:11;
  background:rgba(0,0,0,.6);
  color:#0f0;
  font:12px monospace;
  padding:6px;
}
</style>
</head>

<body>
<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start</button>
</div>

<canvas id="canvas"></canvas>

<script>
/* ===== 設定（ここだけ触ればOK） ===== */

const IMAGE_URL = "./assets/object01.png";

/* 目的地 */
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;

/* 表示条件 */
const SHOW_DISTANCE_M = 10;   // ★ 10m以内で表示

/* 表示位置・サイズ（固定） */
const FIXED_Z = -2.0;         // 常にカメラ正面
const BASE_SPRITE_SIZE = 0.6; // 縦画面で必ず収まる安全サイズ

/* ===== util ===== */
function deg2rad(d){ return d*Math.PI/180; }
function distM(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=deg2rad(lat2-lat1);
  const dLon=deg2rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ===== three.js ===== */

const hud=document.getElementById("hud");
const renderer=new THREE.WebGLRenderer({
  canvas:document.getElementById("canvas"),
  alpha:true, antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

/* 背景（カメラ） */
const bgScene=new THREE.Scene();
const bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
bgScene.add(bgCam);

/* 前景 */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.1,100);
camera.position.set(0,0,0);

let bgMesh, video, videoTexture, sprite;

/* GPS */
let lat=null, lon=null;

/* ===== resize ===== */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  updateCover();
}
window.addEventListener("resize",resize);

/* 背景 cover */
function updateCover(){
  if(!bgMesh||!video||!video.videoWidth) return;
  const sa=innerWidth/innerHeight;
  const va=video.videoWidth/video.videoHeight;
  let sx=1, sy=1;
  if(va>sa) sx=va/sa;
  else sy=sa/va;
  bgMesh.scale.set(sx,sy,1);
}

/* ===== start ===== */
async function start(){
  document.getElementById("start").style.display="none";

  /* カメラ */
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"},
    audio:false
  });

  video=document.createElement("video");
  video.playsInline=true;
  video.muted=true;
  video.srcObject=stream;
  await video.play();

  videoTexture=new THREE.VideoTexture(video);
  bgMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(2,2),
    new THREE.MeshBasicMaterial({map:videoTexture})
  );
  bgScene.add(bgMesh);
  updateCover();

  /* Sprite（固定サイズ・正面） */
  const tex=new THREE.TextureLoader().load(IMAGE_URL);
  sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({map:tex,transparent:true})
  );
  sprite.position.set(0,0,FIXED_Z);
  sprite.scale.set(BASE_SPRITE_SIZE,BASE_SPRITE_SIZE,1);
  sprite.visible=false; // ★ 初期は非表示
  scene.add(sprite);

  /* GPS */
  navigator.geolocation.watchPosition(
    p=>{
      lat=p.coords.latitude;
      lon=p.coords.longitude;
    },
    e=>alert("GPS ERROR: "+e.message),
    { enableHighAccuracy:true }
  );
}
document.getElementById("btn").onclick=start;

/* ===== loop ===== */
function animate(){
  requestAnimationFrame(animate);

  if(!videoTexture){
    renderer.render(scene,camera);
    return;
  }

  renderer.render(bgScene,bgCam);

  if(!sprite || lat===null){
    renderer.autoClear=false;
    renderer.render(scene,camera);
    renderer.autoClear=true;
    return;
  }

  const d=distM(lat,lon,TARGET_LAT,TARGET_LON);

  /* ★ 出る／出ない だけ */
  sprite.visible = (d <= SHOW_DISTANCE_M);

  hud.textContent =
`distance=${d.toFixed(1)}m
visible=${sprite.visible}`;

  renderer.autoClear=false;
  renderer.render(scene,camera);
  renderer.autoClear=true;
}

resize();
animate();
</script>
</body>
</html>
