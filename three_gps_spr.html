<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>GPS Sprite 10m (CSS Video)</title>

<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

/* ★ カメラ映像は CSS で full cover */
#cam{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;   /* ← これが決定打 */
  z-index:0;
}

/* three.js は透明で上に重ねる */
#canvas{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

#start{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  z-index:10;
}
#start button{
  font-size:18px;
  padding:14px 18px;
}
#hud{
  position:fixed;
  top:0; left:0; right:0;
  z-index:11;
  background:rgba(0,0,0,.6);
  color:#0f0;
  font:12px monospace;
  padding:6px;
}
</style>
</head>

<body>

<video id="cam" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div id="hud">waiting…</div>

<div id="start">
  <button id="btn">Start</button>
</div>

<script>
/* ===== 設定 ===== */
const IMAGE_URL = "./assets/object01.png";
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;
const SHOW_DISTANCE_M = 10;

/* util */
function deg2rad(d){return d*Math.PI/180;}
function distM(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=deg2rad(lat2-lat1);
  const dLon=deg2rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* three.js（UI用） */
const renderer=new THREE.WebGLRenderer({
  canvas:document.getElementById("canvas"),
  alpha:true,
  antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
let camera;

/* Sprite */
let sprite;

/* GPS */
let lat=null, lon=null;

/* resize（画面中央基準） */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);

  camera=new THREE.OrthographicCamera(
    -w/2, w/2,
     h/2,-h/2,
     0,10
  );
  camera.position.z=5;
}
window.addEventListener("resize",resize);

/* start */
async function start(){
  document.getElementById("start").style.display="none";

  /* カメラ：CSS video */
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"},
    audio:false
  });
  const cam=document.getElementById("cam");
  cam.srcObject=stream;

  /* three.js UI */
  const tex=new THREE.TextureLoader().load(IMAGE_URL);
  sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({map:tex,transparent:true})
  );
  sprite.position.set(0,0,1);
  sprite.scale.set(240,240,1); // px指定
  sprite.visible=false;
  scene.add(sprite);

  navigator.geolocation.watchPosition(
    p=>{lat=p.coords.latitude;lon=p.coords.longitude;},
    e=>alert(e.message),
    {enableHighAccuracy:true}
  );

  resize();
}
document.getElementById("btn").onclick=start;

/* loop */
function animate(){
  requestAnimationFrame(animate);

  if(sprite && lat!=null){
    const d=distM(lat,lon,TARGET_LAT,TARGET_LON);
    sprite.visible=(d<=SHOW_DISTANCE_M);
    document.getElementById("hud").textContent=
`distance=${d.toFixed(1)}m
visible=${sprite.visible}`;
  }else{
    document.getElementById("hud").textContent="Camera OK. Waiting GPS…";
  }

  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
