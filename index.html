<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            renderer="logarithmicDepthBuffer: true;"
            embedded
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

<!--                <a-entity
                    look-at="[gps-camera]"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    scale="0.20586144591777322 0.20586144591777322 0.20586144591777322"
                    gps-entity-place="latitude: 39.696845; longitude: 141.149665;"
                ></a-entity>-->
            
                <a-entity
                    <a-box position="0 0 -3" depth="1" height="1" width="1"></a-box>
                    <a-light type="directional" position="1 2 1"></a-light>
                ></a-entity>-->
            
            <a-camera gps-camera rotation-reader></a-camera>
        </a-scene>
        <script>
          window.addEventListener("load", () => {
            const asset = document.querySelector("#animated-asset");
        
            asset.addEventListener("loaded", () => {
              alert("GLB asset loaded");
            });
        
            asset.addEventListener("error", (e) => {
              alert("GLB asset ERROR");
              console.error(e);
            });
          });
        </script>
        <script>
          window.addEventListener("load", () => {
            const cam = document.querySelector("[gps-camera]");
        
            cam.addEventListener("gps-camera-update-position", (e) => {
              const p = e.detail.position;
              alert(`GPS OK\nlat=${p.latitude}\nlon=${p.longitude}\nacc=${p.accuracy}`);
            });
        
            cam.addEventListener("gps-camera-error", (e) => {
              alert("GPS ERROR");
              console.error(e);
            });
          });
        </script>
    </body>
</html>
