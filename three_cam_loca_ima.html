<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #btn { position:fixed; bottom:10px; left:10px; z-index:10; font-size:16px; padding:10px 14px; border-radius:10px; border:0; }
    #info { position:fixed; top:0; left:0; right:0; z-index:10; background:rgba(0,0,0,.6); color:#0f0; font:12px monospace; padding:6px; white-space:pre; }
  </style>
</head>
<body>
<div id="info">waiting...</div>
<button id="btn">Start</button>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.1/build/three.module.js";

const IMAGE_URL = "./assets/object01.jpg";
const TARGET_LAT = 39.696845;
const TARGET_LON = 141.149665;

// 平滑化係数（小さいほどヌルヌル安定／大きいほど追従）
const ALPHA_GPS = 0.08;      // GPS平滑化
const ALPHA_HEAD = 0.15;     // 方位平滑化
const ALPHA_MOVE = 0.12;     // 画面内移動の平滑化

// 距離→拡大縮小（大きく見せたいので変化を緩く）
const SCALE_K = 25;          // 大きいほど近づいた時に大きくなる
const SCALE_MIN = 0.8;
const SCALE_MAX = 4.5;

const info = document.getElementById("info");
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(1);

let W=1,H=1;

// 背景シーン（カメラ映像を歪ませず表示）
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
bgScene.add(bgCam);

// 前景シーン（ARオブジェクト）
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
cam.position.set(0,0,0);

// 背景用 video
const video = document.createElement("video");
video.playsInline = true;
video.muted = true;
video.autoplay = true;
let videoTex = null;
let bgMesh = null;

// 画像板
let plane = null;

// センサー値（平滑化後）
let userLat=null, userLon=null;
let latS=null, lonS=null;
let headingS=0;      // rad
let targetRelS=0;    // 相対方位（平滑化）
let xS=0, zS=-3;     // 位置（平滑化）

function clamp(v,a,b){ return Math.min(Math.max(v,a),b); }
function lerp(a,b,t){ return a+(b-a)*t; }
function wrapPi(r){ // -pi..pi
  r = (r + Math.PI) % (2*Math.PI);
  if (r < 0) r += 2*Math.PI;
  return r - Math.PI;
}

function distM(lat1, lon1, lat2, lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingRad(lat1, lon1, lat2, lon2){
  const y=Math.sin((lon2-lon1)*Math.PI/180)*Math.cos(lat2*Math.PI/180);
  const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)
        -Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180);
  return Math.atan2(y,x);
}

// 背景（video）を cover で歪みなく貼る
function updateBackgroundCover(videoW, videoH){
  if(!bgMesh) return;
  const screenAspect = W/H;
  const videoAspect = videoW / videoH;

  // cover: 画面を覆うように拡大
  let sx=1, sy=1;
  if(videoAspect > screenAspect){
    // 動画が横長 → 高さ合わせで横をはみ出す
    sx = videoAspect / screenAspect;
    sy = 1;
  }else{
    // 動画が縦長 → 幅合わせで高さをはみ出す
    sx = 1;
    sy = screenAspect / videoAspect;
  }
  bgMesh.scale.set(sx, sy, 1);
}

function resize(){
  W = innerWidth; H = innerHeight;
  renderer.setSize(W,H,false);
  cam.aspect = W/H;
  cam.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

async function start(){
  // カメラ高解像度要求
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "environment" },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });
  video.srcObject = stream;

  await new Promise(res => video.onloadedmetadata = res);
  await video.play();

  videoTex = new THREE.VideoTexture(video);
  videoTex.colorSpace = THREE.SRGBColorSpace;

  // 背景平面
  const bgGeo = new THREE.PlaneGeometry(2,2);
  const bgMat = new THREE.MeshBasicMaterial({ map: videoTex });
  bgMesh = new THREE.Mesh(bgGeo, bgMat);
  bgScene.add(bgMesh);

  updateBackgroundCover(video.videoWidth, video.videoHeight);

  // 画像を縦横比保持で作る
  const img = await new Promise((resolve, reject)=>{
    const i = new Image();
    i.onload = ()=>resolve(i);
    i.onerror = reject;
    i.src = IMAGE_URL;
  });
  const aspect = img.width / img.height;

  const tex = new THREE.TextureLoader().load(IMAGE_URL);
  const geo = new THREE.PlaneGeometry(1*aspect, 1); // ★縦横比維持
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent:true });
  plane = new THREE.Mesh(geo, mat);
  plane.position.set(0,0,-3);
  scene.add(plane);

  // GPS
  navigator.geolocation.watchPosition(p=>{
    userLat = p.coords.latitude;
    userLon = p.coords.longitude;
    if(latS==null){ latS=userLat; lonS=userLon; } // 初期化
  }, console.error, { enableHighAccuracy:true, maximumAge:0 });

  // 方位（Androidは deviceorientationabsolute が来ない機種もある）
  window.addEventListener("deviceorientationabsolute", e=>{
    if(e.alpha!=null){
      const h = THREE.MathUtils.degToRad(e.alpha);
      // 角度は -pi..pi に丸めて平滑化
      headingS = headingS + wrapPi(h - headingS) * ALPHA_HEAD;
    }
  });

  info.textContent = "running...";
}

document.getElementById("btn").onclick = start;

function animate(){
  requestAnimationFrame(animate);
  if(!plane || latS==null || userLat==null) {
    // 背景だけ描く
    if(bgMesh) renderer.render(bgScene, bgCam);
    return;
  }

  // GPS平滑化
  latS = lerp(latS, userLat, ALPHA_GPS);
  lonS = lerp(lonS, userLon, ALPHA_GPS);

  // 目的地方位と相対方位
  const d = distM(latS, lonS, TARGET_LAT, TARGET_LON);
  const b = bearingRad(latS, lonS, TARGET_LAT, TARGET_LON);
  const rel = wrapPi(b - headingS);

  // 相対方位も平滑化（急に左右に飛ばない）
  targetRelS = targetRelS + wrapPi(rel - targetRelS) * ALPHA_HEAD;

  // 前方3mの円周上に配置（左右にずれる）
  const x = Math.sin(targetRelS) * 3;
  const z = -Math.cos(targetRelS) * 3;

  // 位置平滑化（暴れ防止）
  xS = lerp(xS, x, ALPHA_MOVE);
  zS = lerp(zS, z, ALPHA_MOVE);

  plane.position.set(xS, 0, zS);

  // 距離でスケール
  const scale = clamp(SCALE_K / Math.max(d, 1), SCALE_MIN, SCALE_MAX);
  plane.scale.setScalar(scale);

  // 描画：背景→前景の順
  renderer.render(bgScene, bgCam);
  renderer.autoClear = false;
  renderer.render(scene, cam);
  renderer.autoClear = true;

  info.textContent =
`dist=${d.toFixed(1)}m  scale=${scale.toFixed(2)}
lat=${latS.toFixed(6)} lon=${lonS.toFixed(6)}
heading(deg)=${THREE.MathUtils.radToDeg(headingS).toFixed(1)}
rel(deg)=${THREE.MathUtils.radToDeg(targetRelS).toFixed(1)}`;
}
animate();
</script>
</body>
</html>
