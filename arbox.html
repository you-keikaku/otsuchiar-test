<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }

    /* Start overlay */
    #start {
      position: fixed; inset: 0;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      color:#fff; font: 18px/1.4 sans-serif;
    }
    #start button { font-size:18px; padding:14px 18px; border-radius:10px; border:0; }

    /* ここは保険（最終的にはJSで強制する） */
    #arjs-video{
      position:fixed!important; inset:0!important;
      width:100%!important; height:100%!important;
      object-fit:cover!important;
      z-index: 0!important;
      pointer-events:none;
    }
    canvas, .a-canvas, canvas.a-canvas{
      position:fixed!important; inset:0!important;
      width:100%!important; height:100%!important;
      z-index: 9999!important;
      pointer-events:none;
    }
    a-scene{ background: transparent !important; }
  </style>
</head>

<body>
  <div id="start"><button id="btn">Start AR</button></div>

  <!-- sceneは最初から置く（作り直さない） -->
  <a-scene
    id="scene"
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true; antialias:true"
    arjs="sourceType: webcam; debugUIEnabled: true;"
    style="position:fixed; inset:0; width:100%; height:100%; display:none;"
  >
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.9"></a-light>

    <a-box position="0 0 -3" rotation="0 35 0" color="#E74C3C"></a-box>
    <a-camera></a-camera>
  </a-scene>

  <script>
    const btn = document.getElementById('btn');
    const start = document.getElementById('start');
    const sceneEl = document.getElementById('scene');

    let mo = null;
    let timer = null;

    function hardFixLayersAndSize() {
      // viewport固定（見切れ対策）
      const scene = document.querySelector('a-scene');
      if (scene) {
        scene.style.position = 'fixed';
        scene.style.left = '0';
        scene.style.top = '0';
        scene.style.width = '100vw';
        scene.style.height = '100vh';
        scene.style.zIndex = '10';
        scene.style.background = 'transparent';
      }

      // videoを後ろ
      document.querySelectorAll('video').forEach(v => {
        v.style.position = 'fixed';
        v.style.left = '0';
        v.style.top = '0';
        v.style.width = '100vw';
        v.style.height = '100vh';
        v.style.objectFit = 'cover';
        v.style.zIndex = '0';
        v.style.pointerEvents = 'none';

        v.muted = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
      });

      // canvasを前（かつbody末尾へ）
      document.querySelectorAll('canvas').forEach(c => {
        c.style.position = 'fixed';
        c.style.left = '0';
        c.style.top = '0';
        c.style.width = '100vw';
        c.style.height = '100vh';
        c.style.zIndex = '9999';
        c.style.pointerEvents = 'none';

        // DOM順を最後へ（スタッキングで負ける時の最後の手）
        if (c.parentElement) document.body.appendChild(c);
      });
    }

    btn.addEventListener('click', () => {
      sceneEl.style.display = "block";
      start.remove();

      // 生成順がブレても勝てるように監視＋定期修正（Start後のみ）
      mo = new MutationObserver(hardFixLayersAndSize);
      mo.observe(document.documentElement, { childList: true, subtree: true });

      timer = setInterval(hardFixLayersAndSize, 200);
      setTimeout(hardFixLayersAndSize, 800);

      window.addEventListener('resize', () => setTimeout(hardFixLayersAndSize, 50));
      window.addEventListener('orientationchange', () => setTimeout(hardFixLayersAndSize, 200));
    }, { once:true });
  </script>
</body>
</html>
