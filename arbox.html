<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <!-- A-Frame 1.6.0（AR.js 3.4.7に合わせる） -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js 3.4.7（固定版）: Marker Tracking 用 -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
    #arjs-video { position:fixed!important; top:0; left:0; width:100%!important; height:100%!important; object-fit:cover; z-index:0!important; }
    canvas { position:fixed!important; top:0; left:0; z-index:1!important; }
  </style>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true;"
    arjs="sourceType: webcam; debugUIEnabled: true;"
    style="position: fixed; top:0; left:0; width:100%; height:100%;"
  >
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.9"></a-light>

    <!-- ここで“カメラ映像の上に箱”が出れば、AR.jsカメラ初期化OK -->
    <a-box position="0 0 -3" rotation="0 35 0" color="#E74C3C"></a-box>

    <a-camera></a-camera>
  </a-scene>
</body>
</html>
