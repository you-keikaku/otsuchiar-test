<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
  
    /* AR.js が作るカメラ映像（後ろ） */
    #arjs-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }
  
    /* A-Frame の描画（前） */
    .a-canvas,
    canvas.a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 10 !important;
      pointer-events: none;
    }
  
    a-scene {
      background: transparent !important;
    }
</style>
</head>

<body>
  <div id="start">
    <button id="btn">Start AR（タップして開始）</button>
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      // 1) 先に getUserMedia を「ユーザー操作の文脈」で実行（許可ダイアログを出す）
      try {
        await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      } catch (e) {
        alert("カメラ取得に失敗: " + e.name + "\n" + e.message);
        return;
      }

      // 2) a-scene を“このタイミングで”生成（AR.js がカメラ初期化しやすい）
      const scene = document.createElement('a-scene');
      scene.setAttribute('embedded', '');
      scene.setAttribute('vr-mode-ui', 'enabled: false');
      scene.setAttribute('renderer', 'alpha: true; antialias: true;');
      scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: true;');
      scene.setAttribute('style', 'position: fixed; top:0; left:0; width:100%; height:100%;');

      scene.innerHTML = `
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.9"></a-light>
        <a-box position="0 0 -3" rotation="0 35 0" color="#E74C3C"></a-box>
        <a-camera></a-camera>
      `;

      document.body.appendChild(scene);

      // 3) スタート画面を消す
      document.getElementById('start').remove();

      // 4) 念のため video.play を促す（端末によっては必要）
      setTimeout(async () => {
        const v = document.getElementById('arjs-video');
        if (v) {
          v.muted = true;
          v.setAttribute("playsinline", "");
          v.setAttribute("webkit-playsinline", "");
          try { await v.play(); } catch (_) {}
        }
      }, 500);
    }, { once: true });
  </script>
</body>
</html>
