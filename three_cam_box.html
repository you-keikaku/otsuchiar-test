<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #btn {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-size: 16px; padding: 10px 14px; border-radius: 10px; border: 0;
    }
    #log {
      position: fixed; top:0; left:0; right:0; z-index: 10;
      color:#0f0; background:rgba(0,0,0,.6); padding:6px 8px; font:12px/1.3 monospace;
    }
  </style>
</head>
<body>
  <div id="log">Tap “Start Camera”.</div>
  <button id="btn">Start Camera</button>
  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.1/build/three.module.js";

    const log = (s)=>document.getElementById('log').textContent=s;

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
    camera.position.set(0, 0, 2);

    // ライト
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(1,2,1);
    scene.add(dir);

    // 赤い箱（立体）
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.4),
      new THREE.MeshStandardMaterial({ color: 0xE74C3C })
    );
    box.position.set(0, 0, 0);
    scene.add(box);

    // 背景にカメラ映像（video texture）
    const video = document.createElement('video');
    video.playsInline = true;
    video.muted = true;
    video.autoplay = true;

    let videoTex = null;

    async function startCamera(){
      try{
        log("Requesting camera…");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        videoTex = new THREE.VideoTexture(video);
        videoTex.colorSpace = THREE.SRGBColorSpace;
        scene.background = videoTex;

        log("✅ Camera OK. (VideoTexture)");
      }catch(e){
        log("❌ Camera failed: " + e.name + " / " + e.message);
        alert("Camera failed:\n" + e.name + "\n" + e.message);
      }
    }

    document.getElementById('btn').addEventListener('click', startCamera, { once:true });

    function resize(){
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function animate(){
      requestAnimationFrame(animate);
      box.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
