<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #btn {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-size: 16px; padding: 10px 14px; border-radius: 10px; border: 0;
    }
    #log {
      position: fixed; top:0; left:0; right:0; z-index: 10;
      color:#0f0; background:rgba(0,0,0,.6); padding:6px 8px; font:12px/1.3 monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="log">Tap “Start Camera”.</div>
  <button id="btn">Start Camera</button>
  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.1/build/three.module.js";

    // ★ここだけ合わせる
    const IMAGE_URL = "./assets/object01.jpg";  // ← jpgをここに置く

    const log = (s)=>document.getElementById('log').textContent=s;

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    renderer.setPixelRatio(1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
    camera.position.set(0, 0, 2);

    // 背景：カメラ映像
    const video = document.createElement('video');
    video.playsInline = true;
    video.muted = true;
    video.autoplay = true;

    let plane = null;

    async function startCamera(){
      try{
        log("Requesting camera…");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        scene.background = new THREE.VideoTexture(video);

        // 画像ロード
        const tex = new THREE.TextureLoader().load(
          IMAGE_URL,
          ()=>log("✅ Image loaded."),
          undefined,
          ()=>alert("Image load failed. パス確認")
        );

        const geo = new THREE.PlaneGeometry(1, 1);
        const mat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true
        });

        plane = new THREE.Mesh(geo, mat);
        plane.position.set(0, 0, 0);
        scene.add(plane);

        log("✅ Camera OK + Image shown.");

      }catch(e){
        alert(e.message);
      }
    }

    document.getElementById('btn').addEventListener('click', startCamera, { once:true });

    function resize(){
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
