<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#000; }
    #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
    #btn {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-size: 16px; padding: 10px 14px; border-radius: 10px; border: 0;
    }
    #log {
      position: fixed; top:0; left:0; right:0; z-index: 10;
      color:#0f0; background:rgba(0,0,0,.6); padding:6px 8px; font:12px/1.3 monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="log">Tap “Start Camera”.</div>
  <button id="btn">Start Camera</button>
  <canvas id="c"></canvas>

  <script type="module">
    const MODEL_URL = "./assets/asset.glb"; // ★ここだけ変更（例: "assets/asset.glb"）

    const logEl = document.getElementById('log');
    const log = (s)=>logEl.textContent = s;

    // three.js だけはまず読み込む（ここが失敗するとボタンが効かない）
    import * as THREE from "https://unpkg.com/three@0.160.1/build/three.module.js";

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
    camera.position.set(0, 0, 2);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(1,2,1);
    scene.add(dir);

    // 背景：カメラ映像
    const video = document.createElement('video');
    video.playsInline = true;
    video.muted = true;
    video.autoplay = true;

    let videoTex = null;
    let model = null;

    function resize(){
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function animate(){
      requestAnimationFrame(animate);
      if (videoTex) videoTex.needsUpdate = true;   // ★更新を強制
      if (model) model.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();

    async function startCamera(){
      try{
        log("Requesting camera…");

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        video.srcObject = stream;

        // ★ここが重要：メタデータ待ち（これをしないと黒いままの端末がある）
        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });

        await video.play();

        videoTex = new THREE.VideoTexture(video);
        videoTex.colorSpace = THREE.SRGBColorSpace;
        scene.background = videoTex;

        log("✅ Camera OK.\nNow loading GLB…\n" + MODEL_URL);

        // ★GLTFLoader はここで動的 import（失敗してもカメラは映る）
        const { GLTFLoader } = await import("https://unpkg.com/three@0.160.1/examples/jsm/loaders/GLTFLoader.js?module");
        const loader = new GLTFLoader();

        loader.load(
          MODEL_URL,
          (gltf) => {
            model = gltf.scene;
            scene.add(model);

            // 自動スケーリング
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const scale = 1.0 / maxDim;
            model.scale.setScalar(scale);

            model.position.set(0, -0.3, 0);

            log("✅ Model loaded.\nsize=" +
                `${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)}\nscale=${scale.toFixed(3)}`);
          },
          (xhr) => {
            if (xhr.total) {
              const p = Math.round((xhr.loaded / xhr.total) * 100);
              log(`✅ Camera OK.\nLoading GLB… ${p}%\n${MODEL_URL}`);
            }
          },
          (err) => {
            console.error(err);
            log("❌ GLB load failed.\n" + MODEL_URL + "\n(パス/大文字小文字/404を確認)");
            alert("GLB load failed. パスと大文字小文字、404を確認してください。");
          }
        );

      }catch(e){
        console.error(e);
        log("❌ Camera failed: " + e.name + " / " + e.message);
        alert("Camera failed:\n" + e.name + "\n" + e.message);
      }
    }

    document.getElementById('btn').addEventListener('click', startCamera, { once:true });
  </script>
</body>
</html>
