<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html,body{margin:0;height:100%;background:#000}
    video{width:100%;height:100%;object-fit:cover}
    #log{position:fixed;top:0;left:0;right:0;color:#0f0;background:rgba(0,0,0,.6);padding:8px;font:14px/1.3 monospace;z-index:10}
    button{position:fixed;bottom:12px;left:12px;z-index:11;font-size:16px}
  </style>
</head>
<body>
  <div id="log">loading…</div>
  <video id="v" autoplay playsinline muted></video>
  <button id="btn">Start Camera</button>

  <script>
    const log = (s)=>document.getElementById('log').textContent=s;

    async function start(){
      try{
        log("requesting getUserMedia…");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        document.getElementById('v').srcObject = stream;
        log("✅ getUserMedia OK (camera started)");
      }catch(e){
        log("❌ getUserMedia FAILED: " + e.name + " / " + e.message);
        console.error(e);
        alert("getUserMedia FAILED: " + e.name + "\\n" + e.message);
      }
    }

    document.getElementById('btn').addEventListener('click', start);
  </script>
</body>
</html>
